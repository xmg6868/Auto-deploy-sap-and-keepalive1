        echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
        sudo apt-get update
        sudo apt-get install -y cf8-cli

    - name: Set CF API
      run: |
        echo "CF_API=https://api.cf.us10-003.hana.ondemand.com" >> $GITHUB_ENV

    - name: Login Cloud Foundry
      run: |
        cf login -a ${{ env.CF_API }} \
        -u "${{ secrets.EMAIL }}" \
        -p "${{ secrets.PASSWORD }}"

        ORG=$(cf orgs | sed -n '4p')
        SPACE=$(cf spaces | sed -n '4p')

        echo "ORG=$ORG" >> $GITHUB_ENV
        echo "SPACE=$SPACE" >> $GITHUB_ENV

        cf login -a ${{ env.CF_API }} \
        -u "${{ secrets.EMAIL }}" \
        -p "${{ secrets.PASSWORD }}" \
        -o "$ORG" \
        -s "$SPACE"

    - name: Get applications
      id: get-us-apps
      run: |
        apps=$(cf apps | awk 'NR>3 {print $1}' | grep -v '^$')

        echo "$apps"

        echo "apps<<EOF" >> $GITHUB_OUTPUT
        echo "$apps" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Restart applications
      run: |
        apps="${{ steps.get-us-apps.outputs.apps }}"

        if [ -z "$apps" ]; then
          echo "US 没有应用"
          exit 0
        fi

        for app in $apps; do
          echo "Restart: $app"
          cf restart "$app"
          sleep 20
        done

    - name: Verify
      run: |
        cf apps
