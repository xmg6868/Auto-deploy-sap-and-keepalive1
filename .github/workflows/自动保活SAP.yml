name: 自动保活 SAP

on:
  schedule:
    - cron: '0 21 * * *'     # UTC 21:00 = 北京时间 05:00
  workflow_dispatch:          # 允许手动触发

jobs:

  restart-sg-apps:
    runs-on: ubuntu-latest
    name: Restart SG Apps
    if: always()
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install CF CLI
      run: |
        wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
        echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
        sudo apt-get update
        sudo apt-get install -y cf8-cli

    - name: Set CF API
      run: |
        echo "CF_API=https://api.cf.ap21.hana.ondemand.com" >> $GITHUB_ENV

    - name: Login Cloud Foundry
      run: |
        cf login -a ${{ env.CF_API }} \
        -u "${{ secrets.EMAIL }}" \
        -p "${{ secrets.PASSWORD }}"

        ORG=$(cf orgs | sed -n '4p')
        SPACE=$(cf spaces | sed -n '4p')

        echo "ORG=$ORG" >> $GITHUB_ENV
        echo "SPACE=$SPACE" >> $GITHUB_ENV

        cf login -a ${{ env.CF_API }} \
        -u "${{ secrets.EMAIL }}" \
        -p "${{ secrets.PASSWORD }}" \
        -o "$ORG" \
        -s "$SPACE"

    - name: Get applications
      id: get-sg-apps
      run: |
        apps=$(cf apps | awk 'NR>3 {print $1}' | grep -v '^$')

        echo "$apps"

        echo "apps<<EOF" >> $GITHUB_OUTPUT
        echo "$apps" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Restart applications
      run: |
        apps="${{ steps.get-sg-apps.outputs.apps }}"

        if [ -z "$apps" ]; then
          echo "SG 没有应用"
          exit 0
        fi

        for app in $apps; do
          echo "Restart: $app"
          cf restart "$app"
          sleep 20
        done

    - name: Verify
      run: |
        cf apps


  restart-us-apps:
