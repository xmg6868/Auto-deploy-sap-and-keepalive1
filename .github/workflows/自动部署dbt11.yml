name: SAP Debian 11 XFCE - 自动部署

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  BASE_IMAGE: accetto/debian-vnc-xfce-g3:11
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/debian11-xfce-sap

jobs:

  # ============================================================
  # 第一阶段：构建 Debian 11 XFCE 镜像
  # ============================================================
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 创建 Dockerfile
      # --------------------------------------------------------
      - name: 创建 Dockerfile
        shell: bash
        run: |
          cat > Dockerfile <<'EOF'

          FROM accetto/debian-vnc-xfce-g3:11

          USER root

          # ----------------------------------------------------
          # 基础目录权限
          # ----------------------------------------------------
          RUN mkdir -p /dockerstartup \
              && mkdir -p /tmp \
              && chmod 1777 /tmp

          # ----------------------------------------------------
          # 修复 dockerstartup 目录权限
          # ----------------------------------------------------
          RUN chmod 777 /dockerstartup || true

          # ----------------------------------------------------
          # 修复 accetto 启动脚本可能需要使用的文件
          # ----------------------------------------------------
          RUN if [ -f /dockerstartup/.initial_sudo_password ]; then \
                chmod 666 /dockerstartup/.initial_sudo_password || true; \
              else \
                touch /dockerstartup/.initial_sudo_password && \
                chmod 666 /dockerstartup/.initial_sudo_password; \
              fi

          # ----------------------------------------------------
          # 确保启动脚本可执行
          # ----------------------------------------------------
          RUN if [ -f /dockerstartup/startup.sh ]; then \
                chmod 755 /dockerstartup/startup.sh; \
              fi

          RUN if [ -f /dockerstartup/vnc_startup.sh ]; then \
                chmod 755 /dockerstartup/vnc_startup.sh; \
              fi

          # ----------------------------------------------------
          # XFCE / VNC 配置
          # ----------------------------------------------------
          ENV VNC_RESOLUTION=1024x768
          ENV VNC_COL_DEPTH=16
          ENV VNC_VIEW_ONLY=false
          ENV VNC_PW=headless

          # noVNC
          ENV NOVNC_PORT=6901

          # ----------------------------------------------------
          # locale
          # ----------------------------------------------------
          ENV LANG=C.UTF-8
          ENV LC_ALL=C.UTF-8

          # ----------------------------------------------------
          # noVNC
          # ----------------------------------------------------
          EXPOSE 6901

          # ----------------------------------------------------
          # 保持 root
          #
          # 这里非常重要：
          # 不再使用 USER 1001:1001
          #
          # 因为之前的启动失败就是发生在
          # /dockerstartup/startup.sh
          # 用户初始化阶段。
          # ----------------------------------------------------
          USER root

          # ----------------------------------------------------
          # 使用基础镜像原本的启动脚本
          # ----------------------------------------------------
          CMD ["/dockerstartup/startup.sh"]

          EOF

          echo "================ Dockerfile ================"
          cat Dockerfile
          echo "============================================"

      # --------------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # 登录 GHCR
      # --------------------------------------------------------
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # 构建并上传
      # --------------------------------------------------------
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建完成
        run: |
          echo "======================================"
          echo "Docker 镜像构建完成"
          echo "======================================"
          echo "${{ env.IMAGE_NAME }}:latest"


  # ============================================================
  # 第二阶段：部署 SAP Cloud Foundry
  # ============================================================
  deploy:

    needs: build

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # 安装 CF CLI 8
      # --------------------------------------------------------
      - name: 安装 CF CLI
        shell: bash
        run: |

          set -e

          wget -q -O - \
            https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key \
            | sudo apt-key add -

          echo "deb https://packages.cloudfoundry.org/debian stable main" \
            | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list

          sudo apt-get update

          sudo apt-get install -y cf8-cli

          echo "======================================"
          echo "CF CLI"
          echo "======================================"

          cf --version


      # --------------------------------------------------------
      # 生成应用名称
      # --------------------------------------------------------
      - name: 准备应用名称
        shell: bash
        run: |

          set -e

          RANDOM_STR=$(date +%s%N | sha256sum | cut -c1-6)

          APP_NAME="debian-sap-${RANDOM_STR}"

          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"

          echo "======================================"
          echo "应用名称：$APP_NAME"
          echo "======================================"


      # --------------------------------------------------------
      # 登录 SAP
      # --------------------------------------------------------
      - name: 登录 SAP
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "登录 SAP Cloud Foundry"
          echo "======================================"

          cf login \
            -a https://api.cf.us10-003.hana.ondemand.com \
            -u "${{ secrets.EMAIL }}" \
            -p "${{ secrets.PASSWORD }}" \
            --skip-ssl-validation

          echo "======================================"
          echo "当前目标"
          echo "======================================"

          cf target


      # --------------------------------------------------------
      # 删除同名旧应用
      # --------------------------------------------------------
      - name: 删除旧应用
        shell: bash
        run: |

          set +e

          echo "检查旧应用..."

          if cf app "$APP_NAME" >/dev/null 2>&1; then

            echo "发现旧应用"

            cf stop "$APP_NAME" || true

            cf delete "$APP_NAME" -f -r || true

            sleep 5

          else

            echo "没有旧应用"

          fi


      # --------------------------------------------------------
      # 部署 Debian 11
      # --------------------------------------------------------
      - name: 部署 Debian 11 XFCE
        shell: bash
        continue-on-error: true
        run: |

          echo "======================================"
          echo "部署 Debian 11 XFCE"
          echo "======================================"

          echo "镜像："
          echo "$IMAGE_NAME:latest"

          echo "应用："
          echo "$APP_NAME"

          echo "内存：3060M"

          echo "磁盘：3060M"

          echo "======================================"

          cf push "$APP_NAME" \
            --docker-image "$IMAGE_NAME:latest" \
            --no-route \
            -m 3060M \
            -k 3060M \
            --health-check-type process

          echo "CF PUSH 已结束"


      # --------------------------------------------------------
      # 等待启动
      # --------------------------------------------------------
      - name: 等待应用启动
        shell: bash
        run: |

          echo "======================================"
          echo "等待应用启动"
          echo "======================================"

          sleep 10

          for i in 1 2 3 4 5 6 7 8; do

            echo ""
            echo "========== 第 $i 次检查 =========="

            cf app "$APP_NAME" || true

            sleep 5

          done


      # ========================================================
      # 重要：自动诊断
      # ========================================================

      - name: 输出 APP 状态
        shell: bash
        run: |

          echo ""
          echo "======================================"
          echo "APP STATUS"
          echo "======================================"

          cf app "$APP_NAME" || true


      - name: 输出 Events
        shell: bash
        run: |

          echo ""
          echo "======================================"
          echo "CF EVENTS"
          echo "======================================"

          cf events "$APP_NAME" || true


      - name: 输出最近日志
        shell: bash
        run: |

          echo ""
          echo "======================================"
          echo "CF RECENT LOGS"
          echo "======================================"

          cf logs "$APP_NAME" --recent || true


      - name: 输出环境变量
        shell: bash
        run: |

          echo ""
          echo "======================================"
          echo "CF ENV"
          echo "======================================"

          cf env "$APP_NAME" || true


      # --------------------------------------------------------
      # 如果失败，尝试重启一次
      # --------------------------------------------------------
      - name: 尝试重新启动
        shell: bash
        continue-on-error: true
        run: |

          echo ""
          echo "======================================"
          echo "尝试重新启动应用"
          echo "======================================"

          cf restart "$APP_NAME" || true

          sleep 15

          cf app "$APP_NAME" || true

          echo ""
          echo "======================================"
          echo "重启后的日志"
          echo "======================================"

          cf logs "$APP_NAME" --recent || true


      # ========================================================
      # 获取 SAP 域名
      # ========================================================

      - name: 获取 SAP 域名
        shell: bash
        continue-on-error: true
        run: |

          echo "======================================"
          echo "获取 CF Domain"
          echo "======================================"

          cf domains || true

          DOMAIN=$(cf domains 2>/dev/null | \
            awk '
              NR > 3 &&
              $1 != "" &&
              $1 !~ /^apps\.internal$/ &&
              $1 !~ /^domain$/ &&
              $1 !~ /^name$/ {
                print $1
                exit
              }
            ')

          if [ -z "$DOMAIN" ]; then

            echo "无法自动获取 Domain"

            echo "DOMAIN=" >> "$GITHUB_ENV"

          else

            echo "找到 Domain：$DOMAIN"

            echo "DOMAIN=$DOMAIN" >> "$GITHUB_ENV"

          fi


      # --------------------------------------------------------
      # 创建 Route
      # --------------------------------------------------------
      - name: 创建 Route
        shell: bash
        continue-on-error: true
        run: |

          if [ -z "$DOMAIN" ]; then

            echo "没有 Domain，跳过 Route"

            exit 0

          fi

          echo "======================================"
          echo "创建 Route"
          echo "======================================"

          cf create-route "$DOMAIN" \
            --hostname "$APP_NAME" || true


      # --------------------------------------------------------
      # 映射 noVNC 6901
      # --------------------------------------------------------
      - name: 映射 noVNC 6901
        shell: bash
        continue-on-error: true
        run: |

          if [ -z "$DOMAIN" ]; then

            echo "没有 Domain，跳过"

            exit 0

          fi

          echo "======================================"
          echo "映射 6901"
          echo "======================================"

          cf map-route "$APP_NAME" "$DOMAIN" \
            --hostname "$APP_NAME" \
            --destination-port 6901 || true


      # --------------------------------------------------------
      # 最终状态
      # --------------------------------------------------------
      - name: 最终状态
        shell: bash
        run: |

          echo ""
          echo "======================================"
          echo "最终状态"
          echo "======================================"

          cf app "$APP_NAME" || true

          echo ""
          echo "======================================"
          echo "最终日志"
          echo "======================================"

          cf logs "$APP_NAME" --recent || true

          echo ""
          echo "======================================"
          echo "访问地址"
          echo "======================================"

          if [ -n "$DOMAIN" ]; then

            echo "https://${APP_NAME}.${DOMAIN}"

          else

            echo "Domain 未获取到"

          fi

          echo ""
          echo "======================================"
          echo "部署结束"
          echo "======================================"
