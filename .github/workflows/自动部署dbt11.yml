name: 自动部署debian11

on:
  workflow_dispatch:
    inputs:
      region:
        description: '选择部署区域'
        required: true
        default: 'US(free)'
        type: choice
        options:
          - SG(free)
          - US(free)

          - SAP-UAE(Dubai)
          - SAP-AU(Sydney)
          - SAP-US(Sterling)
          - SAP-US-West(Colorado)
          - SAP-JP(Tokyo)

          - AWS-AU(Sydney)
          - AWS-BR(São Paulo)
          - AWS-KR(Seoul)
          - AWS-CA(Montreal)
          - AWS-US(VA)
          - AWS-US(OR)
          - AWS-EU(Frankfurt)
          - AWS-JP(Tokyo)
          - AWS-SG(Singapore)

          - GCP-AU(Sydney)
          - GCP-BR(São Paulo)
          - GCP-US(IA)
          - GCP-EU(Frankfurt)
          - GCP-JP(Osaka)
          - GCP-JP(Tokyo)
          - GCP-IL(Tel Aviv)
          - GCP-IN(Mumbai)
          - GCP-KSA(Dammam)

          - Azure-AU(Sydney)
          - Azure-BR(São Paulo)
          - Azure-CA(Montreal)
          - Azure-US(VA)
          - Azure-US(WA)
          - Azure-EU(Netherlands)
          - Azure-JP(Tokyo)
          - Azure-SG(Singapore)

          - Neo-UAE(Dubai)
          - Neo-KSA(Riyadh)

      app_name:
        description: '应用名称(可选)'
        required: false
        default: ''


env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE || 'accetto/debian-vnc-xfce-chromium-g3:11' }}
  MEMORY: ${{ secrets.MEMORY || '3060M' }}
  DISK: ${{ secrets.DISK || '3060M' }}


jobs:

  deploy-app:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout code
      uses: actions/checkout@v4


    - name: Install CF CLI
      run: |
        wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
        echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
        sudo apt-get update
        sudo apt-get install -y cf8-cli


    - name: Determine CF API endpoint and app name
      run: |

        RANDOM_STR=$(head /dev/urandom | tr -dc 'a-z' | head -c 6)


        case "${{ github.event.inputs.region }}" in

          "SG(free)")
            echo "CF_API=https://api.cf.ap21.hana.ondemand.com" >> $GITHUB_ENV
            echo "APP_NAME=debian-freesg$RANDOM_STR" >> $GITHUB_ENV
            ;;


          "US(free)")
            echo "CF_API=https://api.cf.us10-003.hana.ondemand.com" >> $GITHUB_ENV
            echo "APP_NAME=debian-freeus$RANDOM_STR" >> $GITHUB_ENV
            ;;


          "SAP-UAE(Dubai)")
            echo "CF_API=https://api.cf.ae01.hana.ondemand.com" >> $GITHUB_ENV
            echo "APP_NAME=debian-ae$RANDOM_STR" >> $GITHUB_ENV
            ;;


          "SAP-AU(Sydney)")
            echo "CF_API=https://api.cf.ap01.hana.ondemand.com" >> $GITHUB_ENV
            echo "APP_NAME=debian-ap$RANDOM_STR" >> $GITHUB_ENV
            ;;


          "SAP-US(Sterling)")
            echo "CF_API=https://api.cf.us01.hana.ondemand.com" >> $GITHUB_ENV
            echo "APP_NAME=debian-us1$RANDOM_STR" >> $GITHUB_ENV
            ;;


          "SAP-US-West(Colorado)")
            echo "CF_API=https://api.cf.us02.hana.ondemand.com" >> $GITHUB_ENV
            echo "APP_NAME=debian-us2$RANDOM_STR" >> $GITHUB_ENV
            ;;


          "SAP-JP(Tokyo)")
            echo "CF_API=https://api.cf.jp01.hana.ondemand.com" >> $GITHUB_ENV
            echo "APP_NAME=debian-jp$RANDOM_STR" >> $GITHUB_ENV
            ;;


        esac


        if [ -n "${{ github.event.inputs.app_name }}" ]; then
          echo "APP_NAME=${{ github.event.inputs.app_name }}" >> $GITHUB_ENV
        fi


        echo "API: $CF_API"
        echo "APP: $APP_NAME"
        echo "IMAGE: ${{ env.DOCKER_IMAGE }}"
            - name: Login to Cloud Foundry
      run: |
        cf login \
        -a ${{ env.CF_API }} \
        -u "${{ secrets.EMAIL }}" \
        -p "${{ secrets.PASSWORD }}"

        ORG=$(cf orgs | sed -n '4p')
        echo "Selected org: $ORG"
        echo "ORG=$ORG" >> $GITHUB_ENV


        SPACE=$(cf spaces | sed -n '4p')
        echo "Selected space: $SPACE"
        echo "SPACE=$SPACE" >> $GITHUB_ENV


        cf login \
        -a ${{ env.CF_API }} \
        -u "${{ secrets.EMAIL }}" \
        -p "${{ secrets.PASSWORD }}" \
        -o "$ORG" \
        -s "$SPACE"



    - name: Deploy Debian 11 XFCE Desktop
      run: |

        if cf push ${{ env.APP_NAME }} \
        --docker-image ${{ env.DOCKER_IMAGE }} \
        -m ${{ env.MEMORY }} \
        -k ${{ env.DISK }} \
        --docker-port 6901 \
        --health-check-type port; then

          echo "Deployment successful"

        else

          cf delete ${{ env.APP_NAME }} -r -f

          echo "资源不足，部署失败，已清理残留"

          exit 1

        fi



    - name: Verify deployment
      run: |

        STATUS=$(cf app ${{ env.APP_NAME }} | grep "requested state:" | awk '{print $3}')


        if [ "$STATUS" = "started" ]; then

          echo "✅ Debian 11 XFCE桌面启动成功"

        else

          echo "❌ Debian启动失败，状态: $STATUS"

          echo "查看日志:"
          cf logs ${{ env.APP_NAME }} --recent

          exit 1

        fi



    - name: Deployment Information
      run: |

        echo "🚀 Debian 11 桌面部署完成"

        echo "区域: ${{ github.event.inputs.region }}"

        echo "组织: ${{ env.ORG }}"

        echo "空间: ${{ env.SPACE }}"

        echo "应用名称: ${{ env.APP_NAME }}"


        ROUTE=$(cf app ${{ env.APP_NAME }} | grep "routes:" | awk '{print $2}')


        if [ -n "$ROUTE" ]; then

          echo "🌐 Debian Web VNC:"
          echo "https://$ROUTE"

        else

          echo "⚠️ 未找到访问地址"

        fi
