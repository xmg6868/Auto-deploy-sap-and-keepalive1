name: SAP Debian 11 XFCE - 自动部署

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CF_API: https://api.cf.us10-003.hana.ondemand.com
  CF_DOMAIN: cfapps.us10-003.hana.ondemand.com

  BASE_IMAGE: accetto/debian-vnc-xfce-g3:11
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/debian11-xfce-sap

  MEMORY: 3060M
  DISK: 3060M
  NOVNC_PORT: 6901

jobs:

  # =========================================================
  # 构建 Debian 11 XFCE + noVNC
  # =========================================================
  build:
    name: Build Debian 11 XFCE
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # 创建 Dockerfile
      # -------------------------------------------------------
      - name: Create Dockerfile
        shell: bash
        run: |
          set -e

          cat > Dockerfile <<'EOF'
          FROM accetto/debian-vnc-xfce-g3:11

          USER root

          ENV LANG=C.UTF-8
          ENV LC_ALL=C.UTF-8

          ENV VNC_RESOLUTION=1024x768
          ENV VNC_COL_DEPTH=16
          ENV VNC_VIEW_ONLY=false
          ENV VNC_PW=headless

          ENV NOVNC_PORT=6901

          RUN mkdir -p /tmp && chmod 1777 /tmp

          RUN if [ -f /dockerstartup/startup.sh ]; then \
                chmod +x /dockerstartup/startup.sh; \
              fi

          RUN if [ -f /dockerstartup/vnc_startup.sh ]; then \
                chmod +x /dockerstartup/vnc_startup.sh; \
              fi

          EXPOSE 6901

          USER root

          CMD ["/dockerstartup/startup.sh"]
          EOF

          echo "======================================"
          echo "Dockerfile:"
          echo "======================================"

          cat Dockerfile

      # -------------------------------------------------------
      # Docker Buildx
      # -------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------------------------------------
      # 登录 GHCR
      # -------------------------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # 构建并推送镜像
      # -------------------------------------------------------
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # =========================================================
  # 部署 SAP BTP Cloud Foundry
  # =========================================================
  deploy:
    name: Deploy SAP Debian 11
    runs-on: ubuntu-latest
    needs: build

    steps:

      # =======================================================
      # 安装 CF CLI v8
      # =======================================================
      - name: Install CF CLI v8
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "安装 CF CLI v8"
          echo "======================================"

          sudo apt-get update

          sudo apt-get install -y \
            wget \
            curl \
            gnupg \
            ca-certificates

          echo "======================================"
          echo "添加 Cloud Foundry GPG Key"
          echo "======================================"

          curl -fsSL \
            https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key \
            | sudo gpg --dearmor \
            -o /usr/share/keyrings/cloudfoundry-keyring.gpg

          echo "======================================"
          echo "添加 Cloud Foundry 软件源"
          echo "======================================"

          echo "deb [signed-by=/usr/share/keyrings/cloudfoundry-keyring.gpg] https://packages.cloudfoundry.org/debian stable main" \
            | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list

          echo "======================================"
          echo "更新软件源"
          echo "======================================"

          sudo apt-get update

          echo "======================================"
          echo "安装 cf8-cli"
          echo "======================================"

          sudo apt-get install -y cf8-cli

          echo "======================================"
          echo "检查 CF CLI"
          echo "======================================"

          if command -v cf8 >/dev/null 2>&1; then
            cf8 version
          fi

          if command -v cf >/dev/null 2>&1; then
            cf version
          else
            CF8_PATH=$(command -v cf8)

            echo "cf 命令不存在，创建软链接..."

            sudo ln -sf "$CF8_PATH" /usr/local/bin/cf

            cf version
          fi

          echo "======================================"
          echo "CF CLI 安装完成"
          echo "======================================"


      # =======================================================
      # 生成 APP 名称
      # =======================================================
      - name: Generate App Name
        shell: bash
        run: |
          set -e

          RANDOM_STR=$(date +%s%N | sha256sum | cut -c1-8)

          APP_NAME="debian-sap-${RANDOM_STR}"
          HOSTNAME="${APP_NAME}"

          echo "APP_NAME=${APP_NAME}" >> "$GITHUB_ENV"
          echo "HOSTNAME=${HOSTNAME}" >> "$GITHUB_ENV"

          echo "======================================"
          echo "APP:"
          echo "${APP_NAME}"
          echo "HOSTNAME:"
          echo "${HOSTNAME}"
          echo "======================================"


      # =======================================================
      # CF API
      # =======================================================
      - name: CF API
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "连接 SAP CF"
          echo "======================================"

          cf api "${CF_API}"

          echo "======================================"
          cf api
          echo "======================================"


      # =======================================================
      # CF 登录
      # =======================================================
      - name: CF Login
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "登录 SAP BTP"
          echo "======================================"

          cf auth \
            "${{ secrets.EMAIL }}" \
            "${{ secrets.PASSWORD }}"


      # =======================================================
      # 选择 Org / Space
      # =======================================================
      - name: CF Target
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "设置 Org / Space"
          echo "======================================"

          cf target \
            -o "0bce8417trial_0bce8417trial" \
            -s "dev"

          echo "======================================"
          cf target
          echo "======================================"


      # =======================================================
      # 清理同名 APP
      # =======================================================
      - name: Cleanup Existing App
        shell: bash
        run: |
          set +e

          echo "======================================"
          echo "检查旧 APP"
          echo "======================================"

          cf app "${APP_NAME}" >/dev/null 2>&1

          if [ $? -eq 0 ]; then

            echo "发现旧 APP:"
            echo "${APP_NAME}"

            echo "删除旧 APP..."

            cf delete "${APP_NAME}" -f

            sleep 10

          else

            echo "没有发现旧 APP"

          fi

          set -e


      # =======================================================
      # 部署 Docker 镜像
      # =======================================================
      - name: CF Push
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "开始部署 Debian 11 XFCE"
          echo "======================================"

          echo "APP:"
          echo "${APP_NAME}"

          echo "IMAGE:"
          echo "${IMAGE_NAME}:latest"

          echo "MEMORY:"
          echo "${MEMORY}"

          echo "DISK:"
          echo "${DISK}"

          echo "noVNC:"
          echo "${NOVNC_PORT}"

          echo "======================================"

          cf push "${APP_NAME}" \
            --docker-image "${IMAGE_NAME}:latest" \
            --no-route \
            --memory "${MEMORY}" \
            --disk "${DISK}" \
            --health-check-type process

          echo "======================================"
          echo "CF PUSH 完成"
          echo "======================================"


      # =======================================================
      # 等待 APP
      # =======================================================
      - name: Wait For App
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "等待 APP 启动"
          echo "======================================"

          for i in $(seq 1 30); do

            echo "检查第 ${i} 次..."

            cf app "${APP_NAME}" || true

            STATUS=$(cf app "${APP_NAME}" 2>/dev/null | grep "requested state" || true)

            if echo "${STATUS}" | grep -q "started"; then
              echo "APP 已启动"
              break
            fi

            sleep 5

          done

          echo "======================================"
          echo "最终状态"
          echo "======================================"

          cf app "${APP_NAME}"


      # =======================================================
      # 创建 Route
      # =======================================================
      - name: Create Route
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "创建公网 Route"
          echo "======================================"

          echo "DOMAIN:"
          echo "${CF_DOMAIN}"

          echo "HOSTNAME:"
          echo "${HOSTNAME}"

          cf create-route \
            "${CF_DOMAIN}" \
            --hostname "${HOSTNAME}" || true

          echo "======================================"
          echo "Route 创建完成"
          echo "======================================"

          cf routes


      # =======================================================
      # 关键：Route -> noVNC 6901
      # =======================================================
      - name: Map Route To noVNC 6901
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "映射公网 Route -> 6901"
          echo "======================================"

          echo "APP:"
          echo "${APP_NAME}"

          echo "DOMAIN:"
          echo "${CF_DOMAIN}"

          echo "HOSTNAME:"
          echo "${HOSTNAME}"

          echo "DESTINATION PORT:"
          echo "${NOVNC_PORT}"

          echo "======================================"

          cf map-route \
            "${APP_NAME}" \
            "${CF_DOMAIN}" \
            --hostname "${HOSTNAME}" \
            --app-port "${NOVNC_PORT}"

          echo "======================================"
          echo "Route 映射完成"
          echo "======================================"


      # =======================================================
      # 获取 APP GUID
      # =======================================================
      - name: Get App GUID
        shell: bash
        run: |
          set -e

          APP_GUID=$(cf app "${APP_NAME}" --guid)

          echo "APP_GUID=${APP_GUID}" >> "$GITHUB_ENV"

          echo "======================================"
          echo "APP GUID:"
          echo "${APP_GUID}"
          echo "======================================"


      # =======================================================
      # 检查 Route
      # =======================================================
      - name: Check Route
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CF ROUTES"
          echo "======================================"

          cf routes

          echo "======================================"
          echo "CF APP"
          echo "======================================"

          cf app "${APP_NAME}"


      # =======================================================
      # 输出访问地址
      # =======================================================
      - name: Show URL
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "       Debian 11 XFCE + noVNC"
          echo "======================================"
          echo ""
          echo "访问地址:"
          echo ""
          echo "https://${HOSTNAME}.${CF_DOMAIN}/"
          echo ""
          echo "APP:"
          echo "${APP_NAME}"
          echo ""
          echo "noVNC Port:"
          echo "${NOVNC_PORT}"
          echo ""
          echo "Memory:"
          echo "${MEMORY}"
          echo ""
          echo "Disk:"
          echo "${DISK}"
          echo ""
          echo "======================================"


      # =======================================================
      # 最终日志
      # =======================================================
      - name: CF Recent Logs
        shell: bash
        run: |
          set +e

          echo ""
          echo "======================================"
          echo "CF APP STATUS"
          echo "======================================"

          cf app "${APP_NAME}"

          echo ""
          echo "======================================"
          echo "CF ROUTES"
          echo "======================================"

          cf routes

          echo ""
          echo "======================================"
          echo "CF EVENTS"
          echo "======================================"

          cf events "${APP_NAME}"

          echo ""
          echo "======================================"
          echo "CF RECENT LOGS"
          echo "======================================"

          cf logs "${APP_NAME}" --recent

          set -e
