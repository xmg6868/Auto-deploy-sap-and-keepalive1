name: 自动部署 Debian 11 极简桌面

on:
  workflow_dispatch:
    inputs:

      region:
        description: "SAP 部署区域"
        required: true
        default: "US(free)"
        type: choice
        options:
          - US(free)
          - SG(free)

      app_name:
        description: "应用名称，留空自动生成"
        required: false
        default: ""

      memory:
        description: "内存"
        required: true
        default: "3060M"

      disk:
        description: "磁盘"
        required: true
        default: "3060M"

env:
  DOCKER_IMAGE: accetto/debian-vnc-xfce-g3:11

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. 安装 CF CLI
      # =====================================================

      - name: Install CF CLI
        shell: bash
        run: |

          set -e

          wget -q -O - \
            https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key \
            | sudo apt-key add -

          echo "deb https://packages.cloudfoundry.org/debian stable main" \
            | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list

          sudo apt-get update

          sudo apt-get install -y cf8-cli

          cf --version


      # =====================================================
      # 2. 选择 SAP 区域
      # =====================================================

      - name: Select SAP Region
        shell: bash
        run: |

          set -e

          case "${{ github.event.inputs.region }}" in

            "US(free)")
              CF_API="https://api.cf.us10-003.hana.ondemand.com"
              PREFIX="debian-us"
              ;;

            "SG(free)")
              CF_API="https://api.cf.ap21.hana.ondemand.com"
              PREFIX="debian-sg"
              ;;

            *)
              echo "未知 SAP 区域"
              exit 1
              ;;

          esac


          # 不使用 tr | head
          # 防止 Broken pipe

          RANDOM_STR=$(date +%s%N | sha256sum | cut -c1-6)


          if [ -n "${{ github.event.inputs.app_name }}" ]; then

            APP_NAME="${{ github.event.inputs.app_name }}"

          else

            APP_NAME="${PREFIX}-${RANDOM_STR}"

          fi


          echo "CF_API=$CF_API" >> "$GITHUB_ENV"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"


          echo "======================================"
          echo "SAP API:"
          echo "$CF_API"
          echo
          echo "APP:"
          echo "$APP_NAME"
          echo
          echo "IMAGE:"
          echo "$DOCKER_IMAGE"
          echo "======================================"


      # =====================================================
      # 3. 登录 SAP
      # =====================================================

      - name: Login SAP
        shell: bash
        run: |

          set -e

          cf login \
            -a "$CF_API" \
            -u "${{ secrets.EMAIL }}" \
            -p "${{ secrets.PASSWORD }}" \
            --skip-ssl-validation

          echo
          echo "登录成功"

          cf target


      # =====================================================
      # 4. 删除旧应用
      # =====================================================

      - name: Delete Old App
        shell: bash
        run: |

          set +e

          echo "检查旧应用..."

          if cf app "$APP_NAME" >/dev/null 2>&1; then

            echo "发现旧应用：$APP_NAME"

            cf stop "$APP_NAME" || true

            cf delete "$APP_NAME" -f -r || true

            sleep 5

          else

            echo "没有旧应用"

          fi


      # =====================================================
      # 5. 部署 Debian 11
      #
      # 关键修改：
      #
      # --health-check-type process
      #
      # 不让 CF 在启动阶段检查 5901/6901
      # =====================================================

      - name: Push Debian 11
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "部署 Debian 11"
          echo "======================================"

          cf push "$APP_NAME" \
            --docker-image "$DOCKER_IMAGE" \
            --no-route \
            -m "${{ github.event.inputs.memory }}" \
            -k "${{ github.event.inputs.disk }}" \
            --health-check-type process

          echo
          echo "cf push 完成"


      # =====================================================
      # 6. 设置 VNC
      # =====================================================

      - name: Configure VNC
        shell: bash
        run: |

          set -e

          echo "设置极简 VNC..."

          # 低分辨率
          cf set-env "$APP_NAME" \
            VNC_RESOLUTION \
            "1024x768"

          # 低色深
          cf set-env "$APP_NAME" \
            VNC_COL_DEPTH \
            "16"

          # 允许操作
          cf set-env "$APP_NAME" \
            VNC_VIEW_ONLY \
            "false"

          # 默认 VNC 密码
          cf set-env "$APP_NAME" \
            VNC_PW \
            "headless"

          # noVNC
          cf set-env "$APP_NAME" \
            NOVNC_PORT \
            "6901"

          echo
          echo "VNC_RESOLUTION=1024x768"
          echo "VNC_COL_DEPTH=16"
          echo "VNC_VIEW_ONLY=false"
          echo "NOVNC_PORT=6901"

          echo
          echo "重新部署..."

          cf restage "$APP_NAME"


      # =====================================================
      # 7. 获取 SAP 默认域
      # =====================================================

      - name: Get SAP Domain
        shell: bash
        run: |

          set -e

          echo "获取 SAP 默认域..."

          DOMAIN=$(cf domains | \
            awk '
              NR > 3 &&
              $1 != "" &&
              $1 !~ /^apps\.internal$/ {
                print $1
                exit
              }
            ')


          if [ -z "$DOMAIN" ]; then

            echo "无法获取 SAP 默认域"

            cf domains

            exit 1

          fi


          echo "DOMAIN=$DOMAIN" >> "$GITHUB_ENV"


          echo
          echo "DOMAIN:"
          echo "$DOMAIN"


      # =====================================================
      # 8. 创建 Route
      # =====================================================

      - name: Create Route
        shell: bash
        run: |

          set -e

          echo "创建 Web Route..."

          cf create-route "$DOMAIN" \
            --hostname "$APP_NAME" || true


      # =====================================================
      # 9. 映射 noVNC 6901
      #
      # 重要：
      # 不使用 --docker-port
      # =====================================================

      - name: Map noVNC 6901
        shell: bash
        run: |

          set -e

          echo "映射 noVNC 6901..."

          cf map-route "$APP_NAME" "$DOMAIN" \
            --hostname "$APP_NAME" \
            --destination-port 6901 || true


          echo
          echo "noVNC 端口：6901"


      # =====================================================
      # 10. 启动应用
      # =====================================================

      - name: Start Debian
        shell: bash
        run: |

          set +e

          echo "======================================"
          echo "启动 Debian 11"
          echo "======================================"

          cf start "$APP_NAME"

          START_RESULT=$?


          echo
          echo "======================================"
          echo "应用状态"
          echo "======================================"

          cf app "$APP_NAME" || true


          echo
          echo "======================================"
          echo "最近日志"
          echo "======================================"

          cf logs "$APP_NAME" --recent || true


          if [ "$START_RESULT" != "0" ]; then

            echo
            echo "======================================"
            echo "Debian 启动失败"
            echo "======================================"

            exit 1

          fi


      # =====================================================
      # 11. 等待容器
      # =====================================================

      - name: Wait For Debian
        shell: bash
        run: |

          set +e

          echo "等待 Debian 11..."

          SUCCESS=0


          for i in $(seq 1 18); do

            echo
            echo "检查 $i / 18"

            STATUS=$(cf app "$APP_NAME" 2>/dev/null \
              | grep "requested state:" \
              | awk '{print $3}')


            echo "状态：$STATUS"


            if [ "$STATUS" = "started" ]; then

              SUCCESS=1

              echo
              echo "Debian 11 已运行"

              break

            fi


            sleep 10

          done


          if [ "$SUCCESS" != "1" ]; then

            echo
            echo "启动检查失败"

            cf app "$APP_NAME" || true

            echo
            echo "最近日志："

            cf logs "$APP_NAME" --recent || true

            exit 1

          fi


      # =====================================================
      # 12. 最终输出
      # =====================================================

      - name: Final Output
        shell: bash
        run: |

          echo
          echo "================================================"
          echo "       Debian 11 极简 XFCE 部署完成"
          echo "================================================"

          echo
          echo "应用："
          echo "$APP_NAME"

          echo
          echo "镜像："
          echo "$DOCKER_IMAGE"

          echo
          echo "内存："
          echo "${{ github.event.inputs.memory }}"

          echo
          echo "磁盘："
          echo "${{ github.event.inputs.disk }}"

          echo
          echo "桌面："
          echo "XFCE"

          echo
          echo "分辨率："
          echo "1024x768"

          echo
          echo "色深："
          echo "16 bit"

          echo
          echo "noVNC："
          echo "6901"

          echo
          echo "VNC："
          echo "5901"

          echo
          echo "================================================"
          echo "浏览器访问："
          echo
          echo "https://${APP_NAME}.${DOMAIN}"
          echo "================================================"

          echo
          echo "VNC 密码："
          echo "headless"

          echo
          echo "================================================"
