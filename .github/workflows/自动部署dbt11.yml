name: 自动部署Debian11极简桌面

on:
  workflow_dispatch:
    inputs:

      region:
        description: "SAP 区域"
        required: true
        default: "US(free)"
        type: choice
        options:
          - SG(free)
          - US(free)

      app_name:
        description: "应用名称（留空自动生成）"
        required: false
        default: ""

      memory:
        description: "内存"
        required: false
        default: "3060M"

      disk:
        description: "磁盘"
        required: false
        default: "3060M"

env:
  # 不带 Chromium，尽可能降低磁盘和内存占用
  DOCKER_IMAGE: accetto/debian-vnc-xfce-g3:11

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. 安装 CF CLI
      # ==========================================
      - name: Install CF CLI
        run: |

          set -e

          wget -q -O - \
            https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key \
            | sudo apt-key add -

          echo "deb https://packages.cloudfoundry.org/debian stable main" \
            | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list

          sudo apt-get update

          sudo apt-get install -y cf8-cli

          cf --version


      # ==========================================
      # 2. 设置 SAP API
      # ==========================================
      - name: Select SAP Region
        shell: bash
        run: |

          set -e

          case "${{ github.event.inputs.region }}" in

            "SG(free)")
              CF_API="https://api.cf.ap21.hana.ondemand.com"
              PREFIX="debian-sg"
              ;;

            "US(free)")
              CF_API="https://api.cf.us10-003.hana.ondemand.com"
              PREFIX="debian-us"
              ;;

            *)
              echo "暂时只开放 SG(free) 和 US(free)"
              exit 1
              ;;

          esac

          RANDOM_STR=$(tr -dc 'a-z0-9' </dev/urandom | head -c 6)

          if [ -n "${{ github.event.inputs.app_name }}" ]; then
            APP_NAME="${{ github.event.inputs.app_name }}"
          else
            APP_NAME="${PREFIX}-${RANDOM_STR}"
          fi

          echo "CF_API=$CF_API" >> "$GITHUB_ENV"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"

          echo "======================================"
          echo "SAP API : $CF_API"
          echo "APP     : $APP_NAME"
          echo "IMAGE   : $DOCKER_IMAGE"
          echo "======================================"


      # ==========================================
      # 3. 登录 SAP
      # ==========================================
      - name: Login SAP
        shell: bash
        run: |

          set -e

          cf login \
            -a "$CF_API" \
            -u "${{ secrets.EMAIL }}" \
            -p "${{ secrets.PASSWORD }}" \
            --skip-ssl-validation

          echo
          echo "当前目标："

          cf target


      # ==========================================
      # 4. 检查当前 Org / Space
      # ==========================================
      - name: Show Target
        run: |

          cf target

          echo
          echo "ORG / SPACE："

          cf target | grep -E "org:|space:" || true


      # ==========================================
      # 5. 删除同名旧应用
      # ==========================================
      - name: Delete Old App
        shell: bash
        run: |

          if cf app "$APP_NAME" >/dev/null 2>&1; then

            echo "发现旧应用：$APP_NAME"

            cf stop "$APP_NAME" || true

            cf delete "$APP_NAME" -f -r || true

            sleep 5

          else

            echo "没有旧应用"

          fi


      # ==========================================
      # 6. 部署 Debian 11
      # ==========================================
      - name: Push Debian 11
        shell: bash
        run: |

          set -e

          echo "开始部署：$DOCKER_IMAGE"

          cf push "$APP_NAME" \
            --docker-image "$DOCKER_IMAGE" \
            --no-route \
            -m "${{ github.event.inputs.memory }}" \
            -k "${{ github.event.inputs.disk }}" \
            --health-check-type port

          echo
          echo "cf push 完成"


      # ==========================================
      # 7. 设置极简 VNC 参数
      # ==========================================
      - name: Configure VNC
        shell: bash
        run: |

          set -e

          echo "设置低资源 VNC 参数..."

          cf set-env "$APP_NAME" VNC_RESOLUTION "1024x768"
          cf set-env "$APP_NAME" VNC_COL_DEPTH "16"
          cf set-env "$APP_NAME" VNC_VIEW_ONLY "false"

          # 默认密码
          cf set-env "$APP_NAME" VNC_PW "headless"

          # 降低安全黑名单相关额外开销
          cf set-env "$APP_NAME" VNC_BLACKLIST_THRESHOLD "20"
          cf set-env "$APP_NAME" VNC_BLACKLIST_TIMEOUT "0"

          cf restage "$APP_NAME"


      # ==========================================
      # 8. 获取默认域
      # ==========================================
      - name: Get App Domain
        shell: bash
        run: |

          set -e

          echo "获取 SAP 默认域名..."

          DOMAIN=$(cf domains \
            | awk 'NR > 3 && $1 !~ /^apps\.internal$/ && $1 != "" {print $1; exit}')

          if [ -z "$DOMAIN" ]; then

            echo "无法获取默认域名"

            cf domains

            exit 1

          fi

          echo "DOMAIN=$DOMAIN" >> "$GITHUB_ENV"

          echo "默认域名：$DOMAIN"


      # ==========================================
      # 9. 创建 HTTP Route
      # ==========================================
      - name: Create Route
        shell: bash
        run: |

          set -e

          echo "创建 Web 路由..."

          cf create-route "$DOMAIN" \
            --hostname "$APP_NAME" || true


      # ==========================================
      # 10. 映射 noVNC 6901
      # ==========================================
      - name: Map noVNC Route
        shell: bash
        run: |

          set -e

          echo "映射到 noVNC 6901..."

          cf map-route "$APP_NAME" "$DOMAIN" \
            --hostname "$APP_NAME" \
            --destination-port 6901 || true


      # ==========================================
      # 11. 启动应用
      # ==========================================
      - name: Start Debian
        shell: bash
        run: |

          set -e

          cf start "$APP_NAME"

          sleep 10


      # ==========================================
      # 12. 查看状态
      # ==========================================
      - name: Check Status
        shell: bash
        run: |

          echo
          echo "======================================"
          echo "应用状态"
          echo "======================================"

          cf app "$APP_NAME"

          echo
          echo "======================================"
          echo "环境变量"
          echo "======================================"

          cf env "$APP_NAME"


      # ==========================================
      # 13. 等待启动
      # ==========================================
      - name: Wait For Start
        shell: bash
        run: |

          set +e

          for i in $(seq 1 18); do

            echo
            echo "检查第 $i/18 次..."

            STATUS=$(cf app "$APP_NAME" 2>/dev/null \
              | grep "requested state:" \
              | awk '{print $3}')

            echo "状态：$STATUS"

            if [ "$STATUS" = "started" ]; then

              echo
              echo "Debian 11 已启动"

              exit 0

            fi

            sleep 10

          done

          echo
          echo "Debian 启动检查超时"

          cf app "$APP_NAME" || true

          echo
          echo "最近日志："

          cf logs "$APP_NAME" --recent || true

          exit 1


      # ==========================================
      # 14. 最终输出
      # ==========================================
      - name: Output Access Information
        shell: bash
        run: |

          echo
          echo "=================================================="
          echo "          Debian 11 极简桌面部署完成"
          echo "=================================================="
          echo

          echo "应用名称："
          echo "$APP_NAME"

          echo
          echo "Docker："
          echo "$DOCKER_IMAGE"

          echo
          echo "资源："
          echo "RAM  : ${{ github.event.inputs.memory }}"
          echo "DISK : ${{ github.event.inputs.disk }}"

          echo
          echo "桌面："
          echo "XFCE"

          echo
          echo "Web VNC："
          echo "6901"

          echo
          echo "VNC："
          echo "5901"

          echo
          echo "=================================================="
          echo "浏览器访问："
          echo "https://${APP_NAME}.${DOMAIN}"
          echo "=================================================="
          echo

          echo "VNC 默认密码："
          echo "123456"

          echo
          echo "=============================================="
