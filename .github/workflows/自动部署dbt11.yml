name: SAP Debian 11 XFCE - 自动部署

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CF_API: https://api.cf.us10-003.hana.ondemand.com
  CF_DOMAIN: cfapps.us10-003.hana.ondemand.com

  # Debian 11 XFCE + noVNC
  BASE_IMAGE: accetto/debian-vnc-xfce-g3:11

  # GHCR 镜像
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/debian11-xfce-sap

  # SAP CF 资源
  MEMORY: 3060M
  DISK: 3060M

  # noVNC HTTP 端口
  NOVNC_PORT: 6901

jobs:

  # =========================================================
  # 1. 构建 Debian 11 XFCE + noVNC Docker 镜像
  # =========================================================
  build:
    name: Build Debian 11 XFCE Image
    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # 创建 Dockerfile
      # -------------------------------------------------------
      - name: Create Dockerfile
        shell: bash
        run: |
          set -e

          cat > Dockerfile <<'EOF'
          FROM accetto/debian-vnc-xfce-g3:11

          USER root

          # ---------------------------------------------------
          # 基础环境
          # ---------------------------------------------------
          ENV LANG=C.UTF-8
          ENV LC_ALL=C.UTF-8

          # ---------------------------------------------------
          # VNC
          # ---------------------------------------------------
          ENV VNC_RESOLUTION=1024x768
          ENV VNC_COL_DEPTH=16
          ENV VNC_VIEW_ONLY=false

          # VNC password
          ENV VNC_PW=headless

          # ---------------------------------------------------
          # noVNC
          # ---------------------------------------------------
          ENV NOVNC_PORT=6901

          # ---------------------------------------------------
          # 临时目录
          # ---------------------------------------------------
          RUN mkdir -p /tmp && chmod 1777 /tmp

          # ---------------------------------------------------
          # 确保启动脚本可以执行
          # ---------------------------------------------------
          RUN if [ -f /dockerstartup/startup.sh ]; then \
                chmod +x /dockerstartup/startup.sh; \
              fi

          RUN if [ -f /dockerstartup/vnc_startup.sh ]; then \
                chmod +x /dockerstartup/vnc_startup.sh; \
              fi

          # ---------------------------------------------------
          # noVNC HTTP 端口
          # ---------------------------------------------------
          EXPOSE 6901

          USER root

          # ---------------------------------------------------
          # 使用原镜像启动脚本
          # ---------------------------------------------------
          CMD ["/dockerstartup/startup.sh"]
          EOF

          echo "======================================"
          echo "Dockerfile"
          echo "======================================"
          cat Dockerfile

      # -------------------------------------------------------
      # Docker Buildx
      # -------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------------------------------------
      # 登录 GHCR
      # -------------------------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------
      # 构建并上传
      # -------------------------------------------------------
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile

          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================
  # 2. 部署到 SAP BTP Cloud Foundry
  # =========================================================
  deploy:
    name: Deploy to SAP Cloud Foundry
    runs-on: ubuntu-latest
    needs: build

    steps:

      # -------------------------------------------------------
      # 安装 CF CLI v8
      # -------------------------------------------------------
      - name: Install CF CLI v8
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "安装 CF CLI"
          echo "======================================"

          wget -q \
            "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=8" \
            -O cf8-cli.tgz

          tar -xzf cf8-cli.tgz

          sudo install cf8 /usr/local/bin/cf

          cf version

      # -------------------------------------------------------
      # 生成唯一 APP 名称
      # -------------------------------------------------------
      - name: Generate App Name
        shell: bash
        run: |
          set -e

          RANDOM_STR=$(date +%s%N | sha256sum | cut -c1-8)

          APP_NAME="debian-sap-${RANDOM_STR}"
          HOSTNAME="${APP_NAME}"

          echo "APP_NAME=${APP_NAME}" >> "$GITHUB_ENV"
          echo "HOSTNAME=${HOSTNAME}" >> "$GITHUB_ENV"

          echo "======================================"
          echo "APP NAME:"
          echo "${APP_NAME}"
          echo "======================================"

      # -------------------------------------------------------
      # CF API
      # -------------------------------------------------------
      - name: CF API
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CF API"
          echo "======================================"

          cf api "${CF_API}"

      # -------------------------------------------------------
      # 登录 SAP BTP
      # -------------------------------------------------------
      - name: CF Login
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "登录 SAP BTP"
          echo "======================================"

          cf auth \
            "${{ secrets.EMAIL }}" \
            "${{ secrets.PASSWORD }}"

      # -------------------------------------------------------
      # 选择 org / space
      # -------------------------------------------------------
      - name: CF Target
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "选择 Org / Space"
          echo "======================================"

          cf target \
            -o "0bce8417trial_0bce8417trial" \
            -s "dev"

          echo "======================================"
          cf target
          echo "======================================"

      # -------------------------------------------------------
      # 删除可能存在的同名 APP
      # -------------------------------------------------------
      - name: Cleanup Existing App
        shell: bash
        run: |
          set +e

          echo "======================================"
          echo "检查旧 APP"
          echo "======================================"

          cf app "${APP_NAME}" >/dev/null 2>&1

          if [ $? -eq 0 ]; then
            echo "发现旧 APP，删除：${APP_NAME}"

            cf delete "${APP_NAME}" -f

            sleep 10
          else
            echo "没有发现旧 APP"
          fi

          set -e

      # -------------------------------------------------------
      # Docker Image
      # -------------------------------------------------------
      - name: Pull Image Info
        shell: bash
        run: |
          echo "======================================"
          echo "Docker Image"
          echo "======================================"
          echo "${IMAGE_NAME}:latest"
          echo "======================================"

      # -------------------------------------------------------
      # Push Docker Image
      # -------------------------------------------------------
      - name: CF Push
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "开始部署 Debian 11 XFCE"
          echo "======================================"

          echo "APP:"
          echo "${APP_NAME}"

          echo "IMAGE:"
          echo "${IMAGE_NAME}:latest"

          echo "MEMORY:"
          echo "${MEMORY}"

          echo "DISK:"
          echo "${DISK}"

          echo "NOVNC PORT:"
          echo "${NOVNC_PORT}"

          echo "======================================"

          cf push "${APP_NAME}" \
            --docker-image "${IMAGE_NAME}:latest" \
            --no-route \
            --memory "${MEMORY}" \
            --disk "${DISK}" \
            --health-check-type process

      # -------------------------------------------------------
      # 等待 APP 启动
      # -------------------------------------------------------
      - name: Wait For App
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "等待 APP 启动"
          echo "======================================"

          for i in $(seq 1 30); do

            echo "检查第 ${i} 次..."

            STATUS=$(cf app "${APP_NAME}" | grep "requested state" || true)

            echo "${STATUS}"

            if echo "${STATUS}" | grep -q "started"; then
              echo "APP 已启动"
              break
            fi

            sleep 5

          done

          echo "======================================"
          cf app "${APP_NAME}"
          echo "======================================"

      # -------------------------------------------------------
      # 创建 Route
      # -------------------------------------------------------
      - name: Create Route
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "创建公网 Route"
          echo "======================================"

          echo "DOMAIN:"
          echo "${CF_DOMAIN}"

          echo "HOSTNAME:"
          echo "${HOSTNAME}"

          cf create-route \
            "${CF_DOMAIN}" \
            --hostname "${HOSTNAME}" || true

          echo "======================================"
          cf routes
          echo "======================================"

      # -------------------------------------------------------
      # 关键步骤：
      # Route -> App Port 6901
      #
      # 你的 CF CLI 支持的是 --app-port
      # 不能使用 --destination-port
      # -------------------------------------------------------
      - name: Map Route To noVNC 6901
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "映射公网 Route -> 6901"
          echo "======================================"

          echo "APP:"
          echo "${APP_NAME}"

          echo "DOMAIN:"
          echo "${CF_DOMAIN}"

          echo "HOSTNAME:"
          echo "${HOSTNAME}"

          echo "DESTINATION PORT:"
          echo "${NOVNC_PORT}"

          echo "======================================"

          cf map-route \
            "${APP_NAME}" \
            "${CF_DOMAIN}" \
            --hostname "${HOSTNAME}" \
            --app-port "${NOVNC_PORT}"

          echo "======================================"
          echo "Route 映射完成"
          echo "======================================"

      # -------------------------------------------------------
      # 获取 App GUID
      # -------------------------------------------------------
      - name: Get App GUID
        shell: bash
        run: |
          set -e

          APP_GUID=$(cf app "${APP_NAME}" --guid)

          echo "APP_GUID=${APP_GUID}" >> "$GITHUB_ENV"

          echo "======================================"
          echo "APP GUID:"
          echo "${APP_GUID}"
          echo "======================================"

      # -------------------------------------------------------
      # 检查 Route 映射
      # -------------------------------------------------------
      - name: Check Route Mapping
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "检查 Route"
          echo "======================================"

          cf routes

          echo "======================================"
          echo "APP"
          echo "======================================"

          cf app "${APP_NAME}"

          echo "======================================"
          echo "GUID:"
          echo "${APP_GUID}"
          echo "======================================"

      # -------------------------------------------------------
      # 输出最终 URL
      # -------------------------------------------------------
      - name: Show URL
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "        Debian 11 XFCE"
          echo "======================================"
          echo ""
          echo "访问地址:"
          echo "https://${HOSTNAME}.${CF_DOMAIN}/"
          echo ""
          echo "noVNC Port:"
          echo "${NOVNC_PORT}"
          echo ""
          echo "APP:"
          echo "${APP_NAME}"
          echo ""
          echo "Memory:"
          echo "${MEMORY}"
          echo ""
          echo "Disk:"
          echo "${DISK}"
          echo ""
          echo "======================================"

      # -------------------------------------------------------
      # 查看 APP 状态
      # -------------------------------------------------------
      - name: CF App Status
        shell: bash
        run: |
          set +e

          echo "======================================"
          echo "CF APP STATUS"
          echo "======================================"

          cf app "${APP_NAME}"

          echo "======================================"
          echo "CF ROUTES"
          echo "======================================"

          cf routes

          echo "======================================"
          echo "CF EVENTS"
          echo "======================================"

          cf events "${APP_NAME}"

          echo "======================================"
          echo "CF RECENT LOGS"
          echo "======================================"

          cf logs "${APP_NAME}" --recent

          set -e
