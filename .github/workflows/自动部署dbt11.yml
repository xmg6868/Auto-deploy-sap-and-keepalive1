 - name: 部署 Debian 11 XFCE
   shell: bash
   continue-on-error: true
  run: |
    echo "======================================"
    echo "部署 Debian 11 XFCE"
    echo "======================================"

    cf push "$APP_NAME" \
      --docker-image "$IMAGE_NAME:latest" \
      --no-route \
      -m 3060M \
      -k 3060M \
      --health-check-type process || true

    echo ""
    echo "======================================"
    echo "等待容器"
    echo "======================================"
    sleep 10

    echo ""
    echo "======================================"
    echo "APP 状态"
    echo "======================================"
    cf app "$APP_NAME" || true

    echo ""
    echo "======================================"
    echo "最近日志"
    echo "======================================"
    cf logs "$APP_NAME" --recent || true

    echo ""
    echo "======================================"
    echo "事件"
    echo "======================================"
    cf events "$APP_NAME" || true

    echo ""
    echo "======================================"
    echo "环境变量"
    echo "======================================"
    cf env "$APP_NAME" || true
