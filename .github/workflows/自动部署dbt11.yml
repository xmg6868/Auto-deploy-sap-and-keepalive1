name: SAP Debian 11 - 自动诊断部署

on:
  workflow_dispatch:
    inputs:
      region:
        description: "SAP 区域"
        required: true
        default: "US(free)"
        type: choice
        options:
          - US(free)
          - SG(free)

      app_name:
        description: "应用名称，留空自动生成"
        required: false
        default: ""

      memory:
        description: "内存"
        required: true
        default: "3060M"

      disk:
        description: "磁盘"
        required: true
        default: "3060M"

env:
  DOCKER_IMAGE: accetto/debian-vnc-xfce-g3:11

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. 安装 CF CLI
      # ============================================================
      - name: Install CF CLI
        shell: bash
        run: |
          set -e

          wget -q -O - \
            https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key \
            | sudo apt-key add -

          echo "deb https://packages.cloudfoundry.org/debian stable main" \
            | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list

          sudo apt-get update
          sudo apt-get install -y cf8-cli

          cf --version


      # ============================================================
      # 2. 选择 SAP 区域
      # ============================================================
      - name: Select SAP Region
        shell: bash
        run: |
          set -e

          case "${{ github.event.inputs.region }}" in

            "US(free)")
              CF_API="https://api.cf.us10-003.hana.ondemand.com"
              PREFIX="debian-us"
              ;;

            "SG(free)")
              CF_API="https://api.cf.ap21.hana.ondemand.com"
              PREFIX="debian-sg"
              ;;

            *)
              echo "未知区域"
              exit 1
              ;;
          esac

          RANDOM_STR=$(date +%s%N | sha256sum | cut -c1-6)

          if [ -n "${{ github.event.inputs.app_name }}" ]; then
            APP_NAME="${{ github.event.inputs.app_name }}"
          else
            APP_NAME="${PREFIX}-${RANDOM_STR}"
          fi

          echo "CF_API=$CF_API" >> "$GITHUB_ENV"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"

          echo "======================================"
          echo "SAP API: $CF_API"
          echo "APP:     $APP_NAME"
          echo "IMAGE:   $DOCKER_IMAGE"
          echo "======================================"


      # ============================================================
      # 3. 登录 SAP
      # ============================================================
      - name: Login SAP
        shell: bash
        run: |
          set -e

          cf login \
            -a "$CF_API" \
            -u "${{ secrets.EMAIL }}" \
            -p "${{ secrets.PASSWORD }}" \
            --skip-ssl-validation

          cf target


      # ============================================================
      # 4. 删除旧应用
      # ============================================================
      - name: Delete Old App
        shell: bash
        run: |
          set +e

          if cf app "$APP_NAME" >/dev/null 2>&1; then
            echo "发现旧应用，删除..."

            cf stop "$APP_NAME" || true

            cf delete "$APP_NAME" \
              -f \
              -r || true

            sleep 5
          fi


      # ============================================================
      # 5. Docker 部署
      #
      # 注意：
      # 不使用 --docker-port
      # 不使用 route
      # 不使用 port health check
      # ============================================================
      - name: Push Debian
        shell: bash
        continue-on-error: true
        run: |
          echo "======================================"
          echo "开始部署 Debian 11"
          echo "======================================"

          echo "Docker image:"
          echo "$DOCKER_IMAGE"

          echo "Memory:"
          echo "${{ github.event.inputs.memory }}"

          echo "Disk:"
          echo "${{ github.event.inputs.disk }}"

          echo "======================================"

          cf push "$APP_NAME" \
            --docker-image "$DOCKER_IMAGE" \
            --no-route \
            -m "${{ github.event.inputs.memory }}" \
            -k "${{ github.event.inputs.disk }}" \
            --health-check-type process

          echo "cf push 执行结束"


      # ============================================================
      # 6. 等待容器
      # ============================================================
      - name: Wait Container
        shell: bash
        run: |
          echo "等待容器启动..."

          sleep 5

          for i in 1 2 3 4 5 6
          do
            echo "--------------------------------------"
            echo "检查 $i/6"
            echo "--------------------------------------"

            cf app "$APP_NAME" || true

            sleep 5
          done


      # ============================================================
      # 7. 获取 CF Events
      # ============================================================
      - name: Get Events
        shell: bash
        run: |
          echo "======================================"
          echo "CF EVENTS"
          echo "======================================"

          cf events "$APP_NAME" || true


      # ============================================================
      # 8. 获取最近日志
      # ============================================================
      - name: Get Recent Logs
        shell: bash
        run: |
          echo "======================================"
          echo "CF LOGS --RECENT"
          echo "======================================"

          cf logs "$APP_NAME" --recent || true


      # ============================================================
      # 9. 获取应用环境
      # ============================================================
      - name: Get Environment
        shell: bash
        run: |
          echo "======================================"
          echo "CF ENV"
          echo "======================================"

          cf env "$APP_NAME" || true


      # ============================================================
      # 10. 获取完整应用状态
      # ============================================================
      - name: Get App Status
        shell: bash
        run: |
          echo "======================================"
          echo "CF APP"
          echo "======================================"

          cf app "$APP_NAME" || true


      # ============================================================
      # 11. 尝试重新启动
      # ============================================================
      - name: Restart App
        shell: bash
        continue-on-error: true
        run: |
          echo "======================================"
          echo "尝试重新启动"
          echo "======================================"

          cf restart "$APP_NAME" || true

          sleep 10

          echo "重新启动后的状态："

          cf app "$APP_NAME" || true

          echo "重新启动后的日志："

          cf logs "$APP_NAME" --recent || true


      # ============================================================
      # 12. 最终诊断
      # ============================================================
      - name: Final Diagnostic
        shell: bash
        run: |
          echo
          echo "=================================================="
          echo "最终诊断信息"
          echo "=================================================="

          echo
          echo "========== APP =========="
          cf app "$APP_NAME" || true

          echo
          echo "========== EVENTS =========="
          cf events "$APP_NAME" || true

          echo
          echo "========== LOGS =========="
          cf logs "$APP_NAME" --recent || true

          echo
          echo "========== ENV =========="
          cf env "$APP_NAME" || true

          echo
          echo "=================================================="
          echo "APP NAME: $APP_NAME"
          echo "DOCKER:   $DOCKER_IMAGE"
          echo "=================================================="

          echo
          echo "如果仍然 crashed，重点看上面的 CF LOGS。"
