name: SAP Debian 11 极简桌面 - Debug

on:
  workflow_dispatch:
    inputs:

      region:
        description: "SAP 区域"
        required: true
        default: "US(free)"
        type: choice
        options:
          - US(free)
          - SG(free)

      app_name:
        description: "应用名称，留空自动生成"
        required: false
        default: ""

      memory:
        description: "内存"
        required: true
        default: "3060M"

      disk:
        description: "磁盘"
        required: true
        default: "3060M"


env:
  DOCKER_IMAGE: accetto/debian-vnc-xfce-g3:11


jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 安装 CF CLI
      # ==========================================

      - name: Install CF CLI
        shell: bash
        run: |

          set -e

          wget -q -O - \
            https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key \
            | sudo apt-key add -

          echo "deb https://packages.cloudfoundry.org/debian stable main" \
            | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list

          sudo apt-get update

          sudo apt-get install -y cf8-cli

          cf --version


      # ==========================================
      # SAP 区域
      # ==========================================

      - name: Select SAP Region
        shell: bash
        run: |

          set -e

          case "${{ github.event.inputs.region }}" in

            "US(free)")
              CF_API="https://api.cf.us10-003.hana.ondemand.com"
              PREFIX="debian-us"
              ;;

            "SG(free)")
              CF_API="https://api.cf.ap21.hana.ondemand.com"
              PREFIX="debian-sg"
              ;;

            *)
              echo "未知区域"
              exit 1
              ;;

          esac


          RANDOM_STR=$(date +%s%N | sha256sum | cut -c1-6)


          if [ -n "${{ github.event.inputs.app_name }}" ]; then
            APP_NAME="${{ github.event.inputs.app_name }}"
          else
            APP_NAME="${PREFIX}-${RANDOM_STR}"
          fi


          echo "CF_API=$CF_API" >> "$GITHUB_ENV"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"


          echo "API: $CF_API"
          echo "APP: $APP_NAME"
          echo "IMAGE: $DOCKER_IMAGE"


      # ==========================================
      # 登录
      # ==========================================

      - name: Login SAP
        shell: bash
        run: |

          set -e

          cf login \
            -a "$CF_API" \
            -u "${{ secrets.EMAIL }}" \
            -p "${{ secrets.PASSWORD }}" \
            --skip-ssl-validation

          cf target


      # ==========================================
      # 删除旧应用
      # ==========================================

      - name: Delete Old App
        shell: bash
        run: |

          set +e

          if cf app "$APP_NAME" >/dev/null 2>&1; then

            echo "删除旧应用..."

            cf stop "$APP_NAME" || true

            cf delete "$APP_NAME" -f -r || true

            sleep 5

          fi


      # ==========================================
      # 推送 Docker
      #
      # 注意：
      # 这里暂时使用 process health check
      # ==========================================

      - name: Push Debian
        shell: bash
        run: |

          set -e

          echo "开始部署：$DOCKER_IMAGE"

          cf push "$APP_NAME" \
            --docker-image "$DOCKER_IMAGE" \
            --no-route \
            -m "${{ github.event.inputs.memory }}" \
            -k "${{ github.event.inputs.disk }}" \
            --health-check-type process


      # ==========================================
      # 查看第一次启动结果
      # ==========================================

      - name: Inspect Initial Start
        shell: bash
        run: |

          set +e

          echo
          echo "=========================================="
          echo "第一次启动后状态"
          echo "=========================================="

          cf app "$APP_NAME"

          echo
          echo "=========================================="
          echo "最近日志"
          echo "=========================================="

          cf logs "$APP_NAME" --recent

          echo
          echo "=========================================="
          echo "环境变量"
          echo "=========================================="

          cf env "$APP_NAME"

          echo
          echo "=========================================="
          echo "应用事件"
          echo "=========================================="

          cf events "$APP_NAME"


      # ==========================================
      # 如果崩溃，尝试一次重新启动
      # ==========================================

      - name: Restart Once
        shell: bash
        run: |

          set +e

          echo
          echo "=========================================="
          echo "尝试重新启动一次"
          echo "=========================================="

          cf restart "$APP_NAME"

          sleep 15

          echo
          echo "=========================================="
          echo "重启后状态"
          echo "=========================================="

          cf app "$APP_NAME"

          echo
          echo "=========================================="
          echo "重启后日志"
          echo "=========================================="

          cf logs "$APP_NAME" --recent


      # ==========================================
      # 获取域名
      # ==========================================

      - name: Get Domain
        shell: bash
        run: |

          set -e

          DOMAIN=$(cf domains | \
            awk '
              NR > 3 &&
              $1 != "" &&
              $1 !~ /^apps\.internal$/ {
                print $1
                exit
              }
            ')


          if [ -z "$DOMAIN" ]; then

            echo "无法获取域名"

            cf domains

            exit 1

          fi


          echo "DOMAIN=$DOMAIN" >> "$GITHUB_ENV"

          echo "DOMAIN=$DOMAIN"


      # ==========================================
      # 创建 Route
      # ==========================================

      - name: Create Route
        shell: bash
        run: |

          set +e

          cf create-route "$DOMAIN" \
            --hostname "$APP_NAME"

          echo "Route:"
          echo "https://${APP_NAME}.${DOMAIN}"


      # ==========================================
      # 映射 6901
      # ==========================================

      - name: Map noVNC
        shell: bash
        run: |

          set +e

          cf map-route "$APP_NAME" "$DOMAIN" \
            --hostname "$APP_NAME" \
            --destination-port 6901

          echo "noVNC route mapped to 6901"


      # ==========================================
      # 最终状态
      # ==========================================

      - name: Final Status
        shell: bash
        run: |

          set +e

          echo
          echo "=========================================="
          echo "最终状态"
          echo "=========================================="

          cf app "$APP_NAME"

          echo
          echo "=========================================="
          echo "最近 200 行日志"
          echo "=========================================="

          cf logs "$APP_NAME" --recent

          echo
          echo "=========================================="
          echo "应用事件"
          echo "=========================================="

          cf events "$APP_NAME"

          echo
          echo "=========================================="
          echo "访问地址"
          echo "=========================================="

          echo "https://${APP_NAME}.${DOMAIN}"
